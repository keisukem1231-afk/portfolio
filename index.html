<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white py-8 text-center">

    <p class="mt-2 text-indigo-200">POSSEでプログラミングを学んでいます</p>

  <main class="max-w-3xl mx-auto px-4 py-12 space-y-16">

    <!--自己紹介-->
    <h1 class="text-2xl font-bold mb-4 self-start">自己紹介</h1>
    <section class="grid flex flex-cols-2 md:grid-cols-4 gap-4 mt-4 ">
        <div class="col-span-2 p-4 gap-2 rounded-lg shadow bg-white">
        <img src="images/IMG_0103-_1_.png" alt="もちの写真" class="flex w-full rounded-full shadow">
        <h2 class="font-bold text-xl mb-1 flex">望月恵祐</h2>
        <p class="text-gray-600">Nickname:もち</p>
        <p class="text-gray-600">誕生日：2007年12月31日</p>
        </div>

        <div class="grid flex p-4 gap-4 rounded-lg shadow bg-white">
        <a href="https://www.instagram.com/omochiii_1231/?hl=ja" target="_blank">
          <img src="images/insta.png" alt="もちのインスタグラム" class="flex w-full rounded-3xl shadow scale-90">
        </a> 
          <img src="images/insta aicon.jpg" alt="もちのインスタグラムアイコン" class="flex rounded-lg shadow hover:scale-105 transition-transform duration-300">
        <h2 class="font-bold text-xl mb-1 flex" >omochiii_1231</h2>
        <p class="text-gray-600">466followers</p>
        </div>

        <div class="grid flex p-4 gap-4 rounded-lg shadow bg-white">
        <img src="images/line.png" alt="もちのライン" class="flex w-full rounded-3xl shadow scale-90">
        <img src="images/スクリーンショット 2026-08-16 191620.png" alt="もちのラインアイコン" class="flex rounded-lg shadow hover:scale-105 transition-transform duration-300">
        <h2 class="font-bold text-xl mb-1 flex" >ID:望月恵祐</h2>
        </div>
    </section>

    <!--スキル-->
    <h1 class="text-2xl font-bold mb-4 self-start">スキル</h1>
    <section class="flex flex-cols-3 gap-4 p-4">
      <div class="bg-blue-200 shadow rounded-3xl p-2 text-center hover:scale-105 transition-transform duration-300 ">
        <h2 class="font-bold text-xl text-gray-800">HTML</h2>
      </div>
      <div class="bg-blue-200 shadow rounded-3xl p-2 text-center hover:scale-105 transition-transform duration-300">
        <h2 class="font-bold text-xl text-gray-800">Tailwind CSS</h2>
      </div>
      <div class="bg-blue-200 shadow rounded-3xl p-2 text-center hover:scale-105 transition-transform duration-300">
        <h2 class="font-bold text-xl text-gray-800">JavaScript</h2>
      </div>
    </section>
</main>
    <footer class="bg-indigo-400 p-6 mx-auto w-full text-center">
      <p class="text-white text-sm">2026　もちのポートフォリオ</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="./js/main.js"></script>

</html>
